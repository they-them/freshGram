name: Retry macOS libraries

on:
  workflow_run:
    workflows: ['Build macOS']
    types: [completed]

permissions:
  actions: read

jobs:
  retry:
    name: Retry the failed libraries
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Rerun the libraries that lost the disk
        run: |
          failed=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.name == "macOS libraries" and .conclusion == "failure")] | length')
          if [ "$failed" = "0" ]; then
            echo "The failure is not in the libraries, nothing to retry."
            exit 0
          fi
          # A newer commit of the branch has its own run, skip the stale one.
          if [ "$RUN_EVENT" = "push" ] && ! git ls-remote --exit-code --tags \
              "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$RUN_BRANCH" > /dev/null 2>&1; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_BRANCH" --jq .sha)
            if [ "$head" != "$RUN_SHA" ]; then
              echo "The branch moved on, nothing to retry."
              exit 0
            fi
          fi
          gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
